- name: Public catalog
  description: Unauthenticated city, theater, and movie discovery
- name: Public screenings
  description: Unauthenticated screening and seat-availability discovery
- name: Customer reservations
  description: Customer seat holds and release
- name: Customer bookings
  description: Customer checkout, history, and cancellation
- name: Customer refunds
  description: Customer refund status
- name: Admin catalog
  description: Administrator catalog management
- name: Admin pricing
  description: Administrator pricing, discount, and refund-policy management
- name: Admin screenings
  description: Administrator screening management
