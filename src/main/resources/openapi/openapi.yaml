openapi: 3.1.0
info:
  title: Movie Ticket Booking API
  description: 'Browse screenings, reserve seats, complete bookings, cancel bookings, and administer the
    local catalog. This document is the source of truth: request/response models and the controller interfaces
    are generated from it at build time.'
  version: v1
servers:
- url: http://localhost:8080
  description: Local development
