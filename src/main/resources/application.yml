spring:
  application:
    name: movie-ticket-booking-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movie_tickets}
    username: ${DB_USERNAME:movie_tickets}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful
