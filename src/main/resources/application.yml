spring:
  application:
    name: movie-ticket-booking-system
  config:
    import: optional:file:.env[.properties]
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/movie_tickets}
    username: ${DB_USERNAME:movie_tickets}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

app:
  booking:
    cleanup-delay: PT30S
    reservation-duration: PT4M
  pagination:
    cursor-signing-key: ${CURSOR_SIGNING_KEY}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
